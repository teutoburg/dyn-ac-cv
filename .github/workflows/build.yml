name: Build CV

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write      # needed to publish the PDF as a release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Rename PDF
        run: cp main.pdf cv.pdf

      - name: Upload PDF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv
          path: cv.pdf
          retention-days: 30

      # Replaces the release tagged "latest" with the new PDF on every push
      # to main. Set the repository variable PUBLISH_RELEASE to "false"
      # (Settings > Secrets and variables > Actions > Variables) to skip this.
      - name: Publish PDF to the "latest" release
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          vars.PUBLISH_RELEASE != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest cv.pdf \
            --title "CV (latest build)" \
            --notes "Built automatically from commit ${GITHUB_SHA::7} on $(date -u +'%Y-%m-%d %H:%M UTC')." \
            --target "$GITHUB_SHA" \
            --latest
